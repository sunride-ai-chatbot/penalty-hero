<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:#000}#h{position:fixed;inset:0}.pg-3d,.pg-3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}</style><div id="h"></div>
<script type="module">import {createPenaltyView} from '../assets/penalties29/demo3d/penalty.js';
const q=new URLSearchParams(location.search);
const v=window.v=createPenaltyView(document.getElementById('h'),{kit:q.get('kit')||'#a50044',trim:q.get('trim')||'#004d98',oppKit:'#ffffff',gkKit:'#39c3d6',number:10,name:'למין ימאל',left:q.has('left'),mood:q.get('mood')||'night'});window.done=0;window.isReady=false;v.ready.then(x=>window.isReady=x);
window.replay=r=>v.replay(r,()=>{window.rdone=(window.rdone||0)+1});window.shoot=r=>v.shoot(r,()=>{window.done++});</script>
