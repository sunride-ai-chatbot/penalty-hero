<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1016">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penalty Hero">
<meta name="description" content="Penalty Hero — דו־קרב פנדלים בטלפון: מול המחשב או מול חבר באמצעות קישור.">
<title>Penalty Hero</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/penalty-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/penalty-192.png">
<link rel="stylesheet" href="src/styles.css">
<link rel="modulepreload" href="src/main.js">
<script>
/* Before the first paint: does the opening film play? (the same rule as wantsSplash in src/ui/splash.js) */
(function(){try{var q=location.search,skip=/[?&]nosplash\b/.test(q)||(/[?&]debug\b/.test(q)&&!/[?&]splash\b/.test(q))||sessionStorage.getItem('ph.splashed')||matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!skip){document.documentElement.classList.add('splash-on');var m=document.querySelector('meta[name=theme-color]');m.dataset.was=m.content;m.content='#dbd2c4'}}catch(e){}})();
</script>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true"><div class="film"><video muted playsinline webkit-playsinline autoplay preload="auto" poster="assets/penalty-splash.webp" src="assets/penalty-splash.mp4"></video></div></div>
<div id="app" aria-live="off"></div>
<noscript><p style="color:#fff;padding:24px;font-family:sans-serif">Penalty Hero צריך JavaScript כדי לרוץ.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
